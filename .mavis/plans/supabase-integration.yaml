version: 1
plan:
  name: 'ربط المنصة بـ Supabase - Production Ready'
  max_concurrency: 10
  max_consecutive_failures: 2
  max_cycles: 15
tasks:
  - id: db-schema
    title: 'إنشاء Supabase Database Schema'
    prompt: |
      أنشئ Supabase database schema كامل لمنصة AI Platform في D:\MAHMOUD\projects\ai-platform
      
      أنشئ ملف src/lib/supabase/schema.sql مع:
      
      1. **Tables:**
         - profiles (id, email, username, display_name, avatar_url, bio, plan, metadata, created_at, updated_at)
         - categories (id, name, slug, description, icon, color, parent_id, sort_order, created_at)
         - tools (id, name, slug, description, logo_url, website_url, documentation_url, pricing_model, monthly_price, category_id, tags, features, alternatives, stats_json, is_featured, is_verified, created_at, updated_at)
         - articles (id, title, slug, excerpt, content, cover_image_url, author_id, category_id, tags, status, featured, read_time, published_at, created_at, updated_at)
         - comments (id, content, article_id, tool_id, parent_id, author_id, is_approved, created_at, updated_at)
         - favorites (id, user_id, article_id, tool_id, created_at)
         - api_keys (id, name, key, prefix, user_id, permissions, rate_limit, expires_at, last_used_at, usage_count, is_active, created_at)
         - api_logs (id, api_key_id, endpoint, method, status_code, ip_address, user_agent, request_body, response_body, duration_ms, created_at)
         - notifications (id, user_id, type, title, body, data_json, is_read, created_at)
         - activity_logs (id, action, entity_type, entity_id, user_id, details_json, created_at)
      
      2. **Row Level Security (RLS):**
         - profiles: users can read their own profile, admins can read all
         - tools: public read, authenticated can create/update own
         - articles: public read, authenticated can create/update own
         - comments: public read, authenticated can create, authors can delete own
         - favorites: users can only see own favorites
         - api_keys: users can only see own keys
         - notifications: users can only see own notifications
      
      3. **Functions:**
         - increment_api_usage(api_key_id)
         - search_tools(query, category_id, pricing)
         - get_dashboard_stats()
      
      4. **Triggers:**
         - handle_new_user (on auth.users insert)
         - update_updated_at (on row update)
      
      5. **Indexes:**
         - tools(name, category_id, pricing_model)
         - articles(title, author_id, status)
         - comments(article_id, tool_id, author_id)
      
      يجب أن يكون الـ SQL متوافق مع Supabase (PostgreSQL).
    assigned_to: coder
    verified_by: verifier
    verify_prompt: |
      راجع الـ SQL schema:
      1. تأكد إن كل الـ tables عندها الـ proper constraints
      2. تأكد إن الـ RLS policies صحيحة وآمنة
      3. تأكد إن الـ indexes مناسبة للـ queries المتوقعة
      4. تأكد من الـ SQL syntax
      
      DO NOT edit files. فقط راجع و report.
    timeout_ms: 1800000
    
