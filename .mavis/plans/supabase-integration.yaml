  - id: api-routes
    title: 'إنشاء API Routes مع Supabase'
    prompt: |
      أنشئ API routes في D:\MAHMOUD\projects\ai-platform\src\app\api
      
      1. /api/tools:
         - GET: list tools with filters (category, pricing, search)
         - POST: create tool (admin only)
         - PUT: update tool (admin/editor)
         - DELETE: delete tool (admin only)
      
      2. /api/articles:
         - GET: list articles with filters
         - POST: create article
         - PUT: update article
         - DELETE: delete article
      
      3. /api/categories:
         - GET: list categories
         - POST: create category (admin only)
         - PUT: update category
      
      4. /api/users:
         - GET: list users (admin only)
         - PUT: update user role
      
      5. /api/search:
         - POST: full-text search across tools and articles
      
      استخدم:
      - Next.js Route Handlers (app/api/...)
      - Supabase server client
      - Zod validation
      - proper error handling
    assigned_to: coder
    verified_by: verifier
